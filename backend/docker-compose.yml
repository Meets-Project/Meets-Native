services:
  postgres:
    image: postgres:16-alpine
    container_name: meets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meets
      POSTGRES_PASSWORD: meets
      POSTGRES_DB: meets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meets -d meets"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meets_backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://meets:meets@postgres:5432/meets
      JWT_SECRET: meets-secret-key-development
      CORS_ORIGIN: "*"
      APP_TIMEZONE: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
