services:
  postgres:
    image: postgres:17-alpine
    container_name: meets-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: meets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meets"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: meets-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/meets
      JWT_SECRET: change-this-secret-in-production

    ports:
      - "3334:3333"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./snack
      dockerfile: Dockerfile

    container_name: meets-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data: